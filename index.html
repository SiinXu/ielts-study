<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a4b8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雅思备考">
<meta name="format-detection" content="telephone=no">
<title>雅思备考 · XU SIYIN</title>
<script>try{var t=localStorage.getItem('ielts.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#home" aria-label="回到目录">雅思 7.5</a>
    <h1 id="title">目录</h1>
    <button id="theme" class="icon" type="button" aria-label="切换深色/浅色">◐</button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="搜索单词、句子、中文…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <label class="chip"><input type="checkbox" id="unread"> 只看未学</label>
  </div>
  <div id="sub" class="sub" hidden>
    <select id="jump" aria-label="跳到小节"></select>
    <span id="secprog" class="secprog"></span>
  </div>
</header>
<main id="main"></main>
<nav class="bottom" id="nav"></nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
